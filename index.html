<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading file…</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="flex min-h-screen items-center justify-center px-6 py-12">
        <section class="w-full max-w-xl rounded-3xl border border-slate-800 bg-slate-900/80 p-8 text-center shadow-2xl shadow-slate-950/50 backdrop-blur">
            <p class="mb-3 inline-flex rounded-full border border-cyan-400/30 bg-cyan-400/10 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-cyan-300">
                Download Center
            </p>

            <h1 class="text-3xl font-semibold tracking-tight text-white sm:text-4xl">
                Your download is starting…
            </h1>

            <p id="status" class="mt-3 text-sm leading-6 text-slate-300 sm:text-base">
                Preparing <code>firmenfest.exe</code>.
            </p>

            <button
                id="downloadButton"
                class="mt-6 inline-flex w-full items-center justify-center rounded-2xl bg-cyan-400 px-4 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-slate-950"
            >
                Download again
            </button>
        </section>
    </main>

    <script>
        async function downloadFile() {
            const status = document.getElementById("status");
            const fileName = "firmenfest.exe";

            try {
                status.textContent = `Downloading ${fileName}...`;

                const response = await fetch(`./${fileName}`);

                if (!response.ok) {
                    throw new Error(`Unable to retrieve ${fileName}`);
                }

                const fileBlob = await response.blob();
                const fileUrl = URL.createObjectURL(fileBlob);

                const downloadLink = document.createElement("a");
                downloadLink.href = fileUrl;
                downloadLink.download = fileName;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                downloadLink.remove();

                URL.revokeObjectURL(fileUrl);
                status.textContent = `${fileName} has been downloaded.`;
            } catch (error) {
                console.error(error);
                status.textContent = `Download failed. Please use the button to try again.`;
            }
        }

        document.getElementById("downloadButton").addEventListener("click", downloadFile);

        window.addEventListener("load", downloadFile);
    </script>
</body>
</html>
