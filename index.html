<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Download</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="flex min-h-screen items-center justify-center px-6 py-12">
        <section class="w-full max-w-xl rounded-3xl border border-slate-800 bg-slate-900/80 p-8 shadow-2xl shadow-slate-950/50 backdrop-blur">
            <div class="mb-8">
                <p class="mb-3 inline-flex rounded-full border border-cyan-400/30 bg-cyan-400/10 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-cyan-300">
                    Download Center
                </p>
                <h1 class="text-3xl font-semibold tracking-tight text-white sm:text-4xl">File download</h1>
                <p class="mt-3 text-sm leading-6 text-slate-300 sm:text-base">
                    Click the button below to open the text file.
                </p>
            </div>

            <div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-5">
                <div class="flex items-start gap-4">
                    <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-cyan-400/10 text-cyan-300">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6">
                            <path d="M12 16.5a.75.75 0 0 1-.53-.22l-4.5-4.5a.75.75 0 1 1 1.06-1.06l3.22 3.22V4.5a.75.75 0 0 1 1.5 0v9.44l3.22-3.22a.75.75 0 1 1 1.06 1.06l-4.5 4.5a.75.75 0 0 1-.53.22Z" />
                            <path d="M3.75 15a.75.75 0 0 1 .75.75v1.5A1.5 1.5 0 0 0 6 18.75h12a1.5 1.5 0 0 0 1.5-1.5v-1.5a.75.75 0 0 1 1.5 0v1.5a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-1.5a.75.75 0 0 1 .75-.75Z" />
                        </svg>
                    </div>

                    <div class="flex-1">
                        <h2 class="text-lg font-medium text-white">Ready to open</h2>
                        <p class="mt-1 text-sm text-slate-400">
                            This opens <code>firmenfest.txt</code> from the same directory as this HTML file.
                        </p>
                    </div>
                </div>

                <button
                    id="openButton"
                    class="mt-6 inline-flex w-full items-center justify-center rounded-2xl bg-cyan-400 px-4 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-slate-950"
                >
                    Open file
                </button>
            </div>
        </section>
    </main>

    <script>
        document.getElementById("openButton").addEventListener("click", () => {
            window.location.href = "./firmenfest.exe";
        });
    </script>
</body>
</html>
